name: Scheduled portal and signed clock OTA

on:
  schedule:
    # 09:17 Asia/Kolkata, Monday/Wednesday/Friday (GitHub cron uses UTC).
    - cron: '47 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      portal_only:
        description: Deploy changed portal code without a firmware release
        type: boolean
        default: false

permissions:
  contents: write # Annotated source/version marker after successful publish.

concurrency:
  group: clock-ota-production
  cancel-in-progress: false

jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source: ${{ steps.portal.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for portal changes
        id: portal
        run: python3 tools/portal_release.py prepare
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.portal.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.portal.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.portal.outputs.changed == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: portal/uv.lock
      - name: Install portal dependencies
        if: steps.portal.outputs.changed == 'true'
        run: |
          npm ci --prefix portal
          uv sync --frozen --project portal
      - name: Test portal before deployment
        if: steps.portal.outputs.changed == 'true'
        env:
          UV_FROZEN: 'true'
        run: |
          python3 -m unittest discover -s tools/tests
          cd portal
          npm test
      - name: Deploy portal and record successful source
        if: steps.portal.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          UV_FROZEN: 'true'
        run: python3 tools/portal_release.py deploy
  release:
    needs: portal
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.portal_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.portal.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for firmware changes and reserve a higher version
        id: release
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PORTAL_ACCESS_CLIENT_ID }}
          PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_ACCESS_CLIENT_SECRET }}
        run: python3 tools/scheduled_ota.py prepare
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.release.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release.outputs.changed == 'true'
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.release.outputs.changed == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: portal/uv.lock
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2
        if: steps.release.outputs.changed == 'true'
        with:
          version: '1.5.1'
      - name: Restore pinned firmware dependencies
        id: firmware-deps
        if: steps.release.outputs.changed == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # Installed packages and indexes only; omit downloaded archives,
          # compiler caches and credential-bearing application objects/binaries.
          path: |
            ~/.arduino15/packages
            ~/.arduino15/*index.json
            ~/.arduino15/*index.json.sig
            ~/Arduino/libraries
          # No fallback keys: skip installation only for this exact toolchain.
          key: firmware-deps-v1-${{ runner.os }}-${{ runner.arch }}-cli-1.5.1-${{ hashFiles('tools/ci_dependencies.sh') }}
      - name: Set up pinned firmware dependencies
        if: steps.release.outputs.changed == 'true'
        env:
          CI_DEPENDENCIES_CACHE_HIT: ${{ steps.firmware-deps.outputs.cache-hit }}
        run: bash tools/ci_dependencies.sh
      - name: Install portal test dependencies
        if: steps.release.outputs.changed == 'true'
        run: uv sync --frozen --no-dev --project portal
      - name: Run portal, signing and firmware host checks
        if: steps.release.outputs.changed == 'true'
        env:
          UV_FROZEN: 'true'
        run: |
          python3 -m unittest discover -s tools/tests
          cd portal
          npm test
          cd ..
          bash tools/check_face_rules.sh
          bash tools/check_face_motion.sh
          bash tools/check_weather_icons.sh
          c++ -std=c++11 tools/check_cooperative_client.cpp -o /tmp/check_cooperative_client
          /tmp/check_cooperative_client
          c++ -std=c++17 tools/check_ota_signature.cpp -o /tmp/check_ota_signature
          /tmp/check_ota_signature
          c++ -std=c++11 tools/check_focus_timer.cpp -o /tmp/check_focus_timer
          /tmp/check_focus_timer
          python3 tools/check_debug_log.py
      - name: Build the versioned application
        if: steps.release.outputs.changed == 'true'
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_DEVICE_TOKEN: ${{ secrets.PORTAL_DEVICE_TOKEN }}
          PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PORTAL_ACCESS_CLIENT_ID }}
          PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_ACCESS_CLIENT_SECRET }}
        run: |
          python3 tools/scheduled_ota.py config
          ./build.sh
      - name: Sign, upload and approve automatic installation
        if: steps.release.outputs.changed == 'true'
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PORTAL_ACCESS_CLIENT_ID }}
          PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_ACCESS_CLIENT_SECRET }}
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/scheduled_ota.py publish --version "$RELEASE_VERSION"
        # Keep user-controlled expressions out of shell source.
        # Version comes from the canonical version validator in prepare.
      - name: Remove generated credentials and binaries
        if: always()
        run: |
          rm -f firmware/BhoomiClock/portal_config.h
          rm -rf build
