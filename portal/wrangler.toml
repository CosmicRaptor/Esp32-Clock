# Bhoomi clock admin portal — Python Worker + static page.
name = "bhoomi-clock"
main = "src/entry.py"
compatibility_date = "2026-10-01"
# Run through pywrangler (`npm run dev` / `npm run deploy`), which vendors the packages in
# pyproject.toml (protobuf) and the `workers` SDK before handing over to wrangler.
compatibility_flags = ["python_workers"]

# The admin page. Files here are served as-is; anything else (the /api/*) reaches the Python code.
[assets]
directory = "./public"

# All clock data: the state document, the photo, and the clock's last check-in.
# No id: `wrangler deploy` creates the namespace on the first deploy and fills it in.
[[kv_namespaces]]
binding = "CLOCK"

# Secrets (not in this file):
#   ADMIN_PASSWORD  password for the admin page
#   DEVICE_TOKEN    the clock's bearer token (also goes in the firmware)
# Locally they come from .dev.vars; in production: `npx wrangler secret put ADMIN_PASSWORD`.

# Shown on the admin page's Spotify card (left of the clock = ME_NAME, right = HER_NAME).
[vars]
ME_NAME = "Aryan"
HER_NAME = "Bhoomi"

# Spotify (Secrets, not in this file; locally in .dev.vars):
#   SPOTIFY_CLIENT_ID      from https://developer.spotify.com/dashboard
#   SPOTIFY_CLIENT_SECRET  same place
#   SPOTIFY_REDIRECT_URI   optional; defaults to <this site>/api/spotify/callback. Register that exact URL in the dashboard.
